[project]
name = "resmap-backend"
version = "0.1.0"
description = "Backend for FPTU ResMap"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "openai>=1.12.0",
    "beautifulsoup4>=4.12.0",
    "google-genai>=0.6.0",
    "slowapi>=0.1.9",
    "async-lru>=2.0.4",
    "pyjwt>=2.8.0",
    "numpy>=2.4.2",
    "scikit-learn>=1.8.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "nltk>=3.9.0",
    "rapidfuzz>=3.9.0",
    "playwright>=1.58.0",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
